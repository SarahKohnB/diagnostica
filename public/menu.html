<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Menu</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="layout">

    <div class="sidebar">

        <h2>MetalTech</h2>

        <p id="usuarioLogado"></p>

        <button onclick="window.location.href='menu.html'">
            Dashboard
        </button>

        <button onclick="window.location.href='produtos.html'">
            Produtos
        </button>

        <button onclick="window.location.href='estoque.html'">
            Estoque
        </button>

        <button onclick="logout()">
            Sair
        </button>

    </div>

    <div class="content">

        <h1>Dashboard</h1>

        <div class="cards">

            <div class="card">
                <h2 id="totalProdutos">0</h2>
                <p>Produtos</p>
            </div>

            <div class="card">
                <h2 id="totalEstoque">0</h2>
                <p>Estoque Total</p>
            </div>

            <div class="card">
                <h2 id="estoqueBaixo">0</h2>
                <p>Abaixo do mínimo</p>
            </div>

        </div>

    </div>

</div>

<script>

const usuario =
JSON.parse(localStorage.getItem("usuario"));

if(!usuario){
    window.location.href="login.html";
}

document.getElementById("usuarioLogado")
.innerText = usuario.nome;

function logout(){
    localStorage.removeItem("usuario");
    window.location.href="login.html";
}

async function carregarDashboard(){

    const res =
    await fetch("/api/dashboard");

    const data = await res.json();

    document.getElementById("totalProdutos")
    .innerText = data.totalProdutos;

    document.getElementById("totalEstoque")
    .innerText = data.totalEstoque;

    document.getElementById("estoqueBaixo")
    .innerText = data.estoqueBaixo;

}

carregarDashboard();

</script>
<script src="auth.js"></script>
</body>
</html>
